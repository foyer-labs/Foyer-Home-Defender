<title>Foyer Panel Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap">
<style>
/* ============================================================
   Foyer Home Defender — panel prototype
   Palette follows Home Assistant's own tokens so the mockup
   reads as a native HA panel, not as a generic web app.
   ============================================================ */
:root {
  --ha-primary:      #03a9f4;
  --ha-primary-dim:  #0288d1;
  --ha-accent:       #ff9800;

  --bg:              #f2f3f5;
  --surface:         #ffffff;
  --surface-2:       #f7f8fa;
  --surface-sunken:  #eceef1;
  --sidebar:         #ffffff;
  --text:            #1f2225;
  --text-2:          #6b7178;
  --text-3:          #9aa0a6;
  --divider:         rgba(18, 22, 26, .10);
  --divider-strong:  rgba(18, 22, 26, .18);
  --shadow:          0 1px 2px rgba(16,20,24,.07), 0 2px 8px rgba(16,20,24,.06);
  --shadow-lift:     0 2px 6px rgba(16,20,24,.10), 0 8px 24px rgba(16,20,24,.10);

  --ok:       #2e9e4f;
  --ok-bg:    #e6f4ea;
  --warn:     #c77700;
  --warn-bg:  #fdf1dd;
  --crit:     #d32f2f;
  --crit-bg:  #fdeaea;
  --info:     #0277bd;
  --info-bg:  #e3f2fd;
  --idle-bg:  #eceef1;

  --radius:      12px;
  --radius-sm:   8px;
  --radius-pill: 999px;
  --sidebar-w:   256px;
  --topbar-h:    64px;

  --mono: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:             #111315;
    --surface:        #1c1f22;
    --surface-2:      #23272b;
    --surface-sunken: #16191b;
    --sidebar:        #1c1f22;
    --text:           #e4e6e8;
    --text-2:         #9ba1a7;
    --text-3:         #767d84;
    --divider:        rgba(255,255,255,.10);
    --divider-strong: rgba(255,255,255,.18);
    --shadow:         0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
    --shadow-lift:    0 2px 6px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.45);
    --ok:      #6ec27f;  --ok-bg:   #1b3323;
    --warn:    #e0a13a;  --warn-bg: #35291433;
    --crit:    #ef6d6d;  --crit-bg: #3a1e1e;
    --info:    #5ab4e8;  --info-bg: #14293a;
    --idle-bg: #2a2e32;
  }
}
:root[data-theme="dark"] {
  --bg:             #111315;
  --surface:        #1c1f22;
  --surface-2:      #23272b;
  --surface-sunken: #16191b;
  --sidebar:        #1c1f22;
  --text:           #e4e6e8;
  --text-2:         #9ba1a7;
  --text-3:         #767d84;
  --divider:        rgba(255,255,255,.10);
  --divider-strong: rgba(255,255,255,.18);
  --shadow:         0 1px 2px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.35);
  --shadow-lift:    0 2px 6px rgba(0,0,0,.55), 0 8px 24px rgba(0,0,0,.45);
  --ok:      #6ec27f;  --ok-bg:   #1b3323;
  --warn:    #e0a13a;  --warn-bg: #3a2e19;
  --crit:    #ef6d6d;  --crit-bg: #3a1e1e;
  --info:    #5ab4e8;  --info-bg: #14293a;
  --idle-bg: #2a2e32;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 14px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--ha-primary-dim); }
a:hover { color: var(--ha-primary); }
:focus-visible { outline: 2px solid var(--ha-primary); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- app shell ---------- */
.app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; min-height: 100vh; }

.sidebar {
  background: var(--sidebar); border-right: 1px solid var(--divider);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.brand {
  height: var(--topbar-h); display: flex; align-items: center; gap: 10px;
  padding: 0 16px; border-bottom: 1px solid var(--divider); flex-shrink: 0;
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  background: #0D1014; display: grid; place-items: center;
}

/* ---------- contextual help ---------- */
.help {
  background: var(--surface); border: 1px solid var(--divider);
  border-left: 3px solid var(--ha-primary); border-radius: var(--radius);
  margin-bottom: 18px; overflow: hidden;
}
.help-hd {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 12px 16px; border: 0; background: transparent; color: var(--text);
  font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; text-align: left;
}
.help-hd .chev { margin-left: auto; color: var(--text-3); transition: transform .15s; }
.help[data-open="false"] .chev { transform: rotate(-90deg); }
.help[data-open="false"] .help-body { display: none; }
.help-body { padding: 0 16px 16px 16px; }
.help-body > p { margin: 0 0 12px; color: var(--text-2); font-size: 13.5px; max-width: 72ch; }
.help-list { display: grid; grid-template-columns: minmax(120px, 190px) 1fr; gap: 6px 16px; font-size: 13px; }
.help-list dt { color: var(--text); font-weight: 500; }
.help-list dd { margin: 0; color: var(--text-2); }
.help-more { margin-top: 12px; font-size: 12.5px; }
.help-lang {
  margin-left: auto; font-size: 11px; font-family: var(--mono); color: var(--text-3);
  border: 1px solid var(--divider); border-radius: var(--radius-pill); padding: 1px 8px;
}
@media (max-width: 560px) { .help-list { grid-template-columns: minmax(0,1fr); gap: 2px; } .help-list dd { margin-bottom: 8px; } }
.brand-name { font-weight: 500; font-size: 15px; letter-spacing: -.01em; }
.brand-sub { font-size: 11px; color: var(--text-3); letter-spacing: .04em; text-transform: uppercase; }

.nav { padding: 8px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.nav-sec {
  font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3);
  padding: 14px 12px 6px; font-weight: 500;
}
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 12px; border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--text-2); font: inherit; font-size: 14px;
  cursor: pointer; text-align: left; transition: background .12s, color .12s;
}
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item[aria-current="page"] { background: var(--info-bg); color: var(--ha-primary-dim); font-weight: 500; }
:root[data-theme="dark"] .nav-item[aria-current="page"],
:root:not([data-theme="light"]) .nav-item[aria-current="page"] { color: var(--info); }
.nav-item svg { flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size: 11px; font-weight: 500; padding: 1px 7px;
  border-radius: var(--radius-pill); background: var(--crit-bg); color: var(--crit);
}

/* ---------- topbar ---------- */
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--topbar-h); background: var(--surface); border-bottom: 1px solid var(--divider);
  display: flex; align-items: center; gap: 16px; padding: 0 20px;
  position: sticky; top: 0; z-index: 20;
}
.topbar h1 { font-size: 19px; font-weight: 500; margin: 0; letter-spacing: -.01em; }
.topbar-spacer { flex: 1; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent;
  color: var(--text-2); display: grid; place-items: center; cursor: pointer;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }

.content { padding: 20px; max-width: 1240px; width: 100%; }
.page-intro { color: var(--text-2); margin: 0 0 18px; max-width: 68ch; }

/* ---------- banner ---------- */
.banner {
  display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  border-radius: var(--radius); margin-bottom: 16px; font-size: 13.5px;
  border: 1px solid transparent;
}
.banner strong { font-weight: 500; }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: color-mix(in oklab, var(--warn) 35%, transparent); }
.banner.crit { background: var(--crit-bg); color: var(--crit); border-color: color-mix(in oklab, var(--crit) 35%, transparent); }
.banner.info { background: var(--info-bg); color: var(--info); border-color: color-mix(in oklab, var(--info) 30%, transparent); }
.banner .spacer { flex: 1; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  border: 1px solid var(--divider); overflow: hidden;
}
.card-head {
  display: flex; align-items: center; gap: 10px; padding: 14px 18px;
  border-bottom: 1px solid var(--divider);
}
.card-head h2 { margin: 0; font-size: 15px; font-weight: 500; letter-spacing: -.005em; }
.card-head .sub { font-size: 12.5px; color: var(--text-3); }
.card-head .spacer { flex: 1; }
.card-body { padding: 18px; }
.card-body.flush { padding: 0; }

.grid { display: grid; gap: 16px; }
.g-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-side { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: start; }

/* ---------- area state tiles ---------- */
.area-tile {
  background: var(--surface); border: 1px solid var(--divider); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
  border-left: 4px solid var(--state, var(--text-3));
}
.area-tile .name { font-weight: 500; font-size: 15px; }
.area-tile .state { font-size: 13px; color: var(--state); font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
.area-tile .meta { font-size: 12.5px; color: var(--text-3); }
.area-tile .countdown {
  font-family: var(--mono); font-size: 26px; font-weight: 500; color: var(--state);
  font-variant-numeric: tabular-nums;
}

/* ---------- pills & chips ---------- */
.pill {
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px;
  border-radius: var(--radius-pill); font-size: 12px; font-weight: 500; white-space: nowrap;
}
.pill.ok   { background: var(--ok-bg);   color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.crit { background: var(--crit-bg); color: var(--crit); }
.pill.info { background: var(--info-bg); color: var(--info); }
.pill.idle { background: var(--idle-bg); color: var(--text-2); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

.tag {
  display: inline-block; padding: 1px 8px; border-radius: var(--radius-sm);
  background: var(--surface-sunken); color: var(--text-2); font-size: 11.5px;
  border: 1px solid var(--divider);
}

/* ---------- tables ---------- */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th {
  text-align: left; font-weight: 500; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: .05em; color: var(--text-3); padding: 10px 14px;
  border-bottom: 1px solid var(--divider); white-space: nowrap; background: var(--surface-2);
}
td { padding: 11px 14px; border-bottom: 1px solid var(--divider); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.clickable { cursor: pointer; }
tbody tr.clickable:hover { background: var(--surface-2); }
tbody tr[aria-selected="true"] { background: var(--info-bg); }
.mono { font-family: var(--mono); font-size: 12.5px; color: var(--text-2); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons & inputs ---------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px;
  border-radius: var(--radius-sm); border: 1px solid var(--divider-strong);
  background: var(--surface); color: var(--text); font: inherit; font-size: 13.5px;
  font-weight: 500; cursor: pointer; transition: background .12s;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--ha-primary); border-color: var(--ha-primary); color: #fff; }
.btn.primary:hover { background: var(--ha-primary-dim); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: #fff; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }

input[type="text"], input[type="number"], input[type="time"], select, textarea {
  width: 100%; padding: 9px 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--divider-strong); background: var(--surface);
  color: var(--text); font: inherit; font-size: 13.5px;
}
textarea { font-family: var(--mono); font-size: 12.5px; resize: vertical; }
label.field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; color: var(--text-2); }
label.field > span.lbl { font-weight: 500; color: var(--text); font-size: 13px; }
label.field > span.hint { font-size: 12px; color: var(--text-3); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.row > * { flex: 1 1 180px; min-width: 0; }
.switch-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--divider); }
.switch-row:last-child { border-bottom: 0; }
.switch-row .lbl { font-size: 13.5px; }
.switch-row .hint { font-size: 12px; color: var(--text-3); }
.switch-row .spacer { flex: 1; }

.sw { width: 38px; height: 22px; border-radius: 999px; background: var(--divider-strong); position: relative; border: 0; cursor: pointer; flex-shrink: 0; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.sw[aria-checked="true"] { background: var(--ha-primary); }
.sw[aria-checked="true"]::after { transform: translateX(16px); }

/* ---------- tabs ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--divider); margin-bottom: 18px; overflow-x: auto; }
.tab {
  padding: 11px 16px; border: 0; background: transparent; color: var(--text-2);
  font: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.tab[aria-selected="true"] { color: var(--ha-primary-dim); border-bottom-color: var(--ha-primary); }
:root[data-theme="dark"] .tab[aria-selected="true"] { color: var(--info); }

/* ---------- inheritance / trace ---------- */
.inherit {
  display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3);
  padding: 8px 12px; background: var(--surface-sunken); border-radius: var(--radius-sm);
}
.inherit b { color: var(--text); font-weight: 500; }

.trace { font-family: var(--mono); font-size: 12.5px; line-height: 1.75; }
.trace-step { display: grid; grid-template-columns: 62px 1fr; gap: 12px; padding: 9px 0; border-bottom: 1px dashed var(--divider); }
.trace-step:last-child { border-bottom: 0; }
.trace-t { color: var(--text-3); font-variant-numeric: tabular-nums; }
.trace-body > div { padding: 1px 0; }
.trace-key { color: var(--text-2); }
.trace-yes { color: var(--ok); }
.trace-no  { color: var(--text-3); text-decoration: line-through; text-decoration-color: var(--text-3); }
.trace-wait { color: var(--warn); }
.trace-crit { color: var(--crit); font-weight: 500; }

/* ---------- simulator sensor toggles ---------- */
.simzone {
  display: flex; align-items: center; gap: 10px; padding: 9px 12px;
  border: 1px solid var(--divider); border-radius: var(--radius-sm); background: var(--surface);
}
.simzone.forced { border-color: var(--ha-accent); background: color-mix(in oklab, var(--ha-accent) 8%, var(--surface)); }
.simzone .nm { flex: 1; font-size: 13px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- keypad ---------- */
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 240px; }
.key {
  aspect-ratio: 1; border-radius: var(--radius-sm); border: 1px solid var(--divider-strong);
  background: var(--surface-2); color: var(--text); font: inherit; font-size: 20px; font-weight: 400;
  cursor: pointer; min-height: 48px;
}
.key:hover { background: var(--surface-sunken); }
.pin-display {
  font-family: var(--mono); font-size: 24px; letter-spacing: .5em; text-align: center;
  padding: 12px; background: var(--surface-sunken); border-radius: var(--radius-sm);
  margin-bottom: 10px; min-height: 52px; color: var(--text);
}

/* ---------- lovelace card previews ---------- */
.lovelace-bg {
  background: var(--surface-sunken); border-radius: var(--radius); padding: 20px;
  display: flex; flex-direction: column; gap: 8px;
}
.lcard {
  background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
  border: 1px solid var(--divider); padding: 16px; max-width: 360px;
}
.lcard-title { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
.lcard-state { font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; }

.scn-row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
.scn-chip {
  padding: 6px 12px; border-radius: var(--radius-pill); border: 1px solid var(--divider-strong);
  background: var(--surface); font-size: 12.5px; cursor: pointer; font: inherit; font-size: 12.5px;
  color: var(--text-2);
}
.scn-chip[aria-pressed="true"] { background: var(--ha-primary); border-color: var(--ha-primary); color: #fff; font-weight: 500; }

/* ---------- wizard ---------- */
.wiz-steps { display: flex; gap: 0; margin-bottom: 22px; flex-wrap: wrap; }
.wiz-step { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); padding-right: 10px; }
.wiz-step .n {
  width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-sunken); color: var(--text-3); font-size: 11.5px; font-weight: 500; flex-shrink: 0;
}
.wiz-step.done .n { background: var(--ok); color: #fff; }
.wiz-step.active .n { background: var(--ha-primary); color: #fff; }
.wiz-step.active { color: var(--text); font-weight: 500; }
.wiz-sep { width: 24px; height: 1px; background: var(--divider-strong); align-self: center; margin-right: 10px; }

/* ---------- misc ---------- */
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 8px 16px; font-size: 13.5px; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; }
.note {
  font-size: 12.5px; color: var(--text-2); background: var(--surface-sunken);
  border-radius: var(--radius-sm); padding: 10px 12px; border-left: 3px solid var(--ha-primary);
}
.spec-ref { font-size: 11.5px; color: var(--text-3); font-family: var(--mono); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-sm { display: flex; flex-direction: column; gap: 8px; }
.hr { height: 1px; background: var(--divider); margin: 16px 0; }
.empty { padding: 32px; text-align: center; color: var(--text-3); font-size: 13.5px; }

@media (max-width: 1100px) {
  .g-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: static; height: auto; }
  .nav { flex-direction: row; overflow-x: auto; }
  .nav-sec { display: none; }
  .nav-item { white-space: nowrap; }
  .nav-item span { display: none; }
  .g-2, .g-3, .g-4 { grid-template-columns: minmax(0, 1fr); }
  .content { padding: 16px; }
}
</style>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" id="brandMark"></div>
      <div>
        <div class="brand-name">Foyer</div>
        <div class="brand-sub">Home Defender</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">Overview</h1>
      <div class="topbar-spacer"></div>
      <button class="icon-btn" id="helpBtn" title="Show or hide all help panels" aria-label="Toggle help panels"></button>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark theme" aria-label="Toggle theme"></button>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<script>
/* ============================================================
   Icons — 24px stroke set, drawn rather than emoji so they
   recolor with the theme.
   ============================================================ */
const ICON = {
  shield:  'M12 3l7 3v6c0 4.3-2.9 7.9-7 9-4.1-1.1-7-4.7-7-9V6l7-3z',
  gauge:   'M3 13a9 9 0 0118 0M12 13l4-4',

const R = {};

/* ---------- 1. Overview ---------- */
R.overview = () => {
  const tiles = AREAS.map(a => {

/* ---------- 2. Areas ---------- */

/* ---------- 9. Test & diagnostics ---------- */
R.test = (sub = 'diagnostics') => {

  let body = '';

  if (sub === 'diagnostics') {
    const rows = ZONES.map(z => `
      <tr>
        <td><strong>${z.n}</strong></td>

        <td>${z.s === 'OPEN' ? pill('warn','open') : `<span style="color:var(--text-2)">${z.s}</span>`}</td>

        <td class="num">${z.batt === null ? '—' : z.batt + '%'}</td>
        <td>${healthPill(z.health)}</td>

      </tr>`);
    body = card('Live zone state',
      table(['Zone','Entity','State','Trigger evaluation','Last change','Battery','Health','Arming'], rows),
      { sub: 'updates live', flush: true });

  if (sub === 'simulator') {

    body = `
    <div class="banner info">${svg(ICON.flask, 18)}

    <div class="grid g-side">

            <div class="trace-key">Group "Open plan": 1 of 2 within 60 s → not satisfied</div>
            <div class="trace-no">✗ group profile Full — threshold not reached</div>
            <div class="trace-yes">✓ member profile <b>Silent</b>: notify Luca, no siren</div>
          </div></div>
          <div class="trace-step"><div class="trace-t">19:32:00</div><div class="trace-body">
            <div>Zone <b>Kitchen window</b> → <span class="trace-crit">open</span></div>
            <div class="trace-key">Area "Perimeter" is armed · scenario "Night"</div>

          <div class="trace-step"><div class="trace-t">19:32:00</div><div class="trace-body">
            <div class="trace-crit">→ state: triggered</div>
            <div class="trace-key">Effective profile: <b>Full</b> (inherited from area "Perimeter")</div>

    body = `
    <div class="banner warn">${svg(ICON.alert, 18)}
      <div><strong>These really execute.</strong> Sirens really sound and messages really send. Every test is logged as a test, and requires the <span class="mono">test_actions</span> permission.</div>

  return `<div class="tabs" role="tablist">${tabs}</div>${body}`;

          </div>

          <label class="field" style="flex:0 0 150px"><span class="hint">Type</span>
            <select><option>${t}</option><option>instant</option><option>delayed</option><option>follower</option></select></label>
          <label class="field" style="flex:0 0 150px"><span class="hint">Triggered when</span>
            <select><option>${trig}</option><option>off</option></select></label>
        </div>`).join('')}
      <button class="btn sm" style="align-self:flex-start">${svg(ICON.plus, 15)} Add another entity</button>
    </div>
    <div class="note" style="margin-top:16px">
      <strong>Confirm the trigger state for each zone.</strong> Foyer proposes one from the entity's device class, but NC and NO magnetic contacts behave in opposite ways — a wrong guess here produces an alarm that never fires, and you would not find out until it mattered.
    </div>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn ghost">Back</button>
      <span style="flex:1"></span>
      <button class="btn">Skip for now</button>
      <button class="btn primary">Continue</button>
    </div>
  `)}`;
};

/* ============================================================
   Router
   ============================================================ */
let current = 'overview';
let testSub = 'diagnostics';
let helpOpen = {};        // per page, as it would be stored per HA user
let helpHidden = false;   // the global ? toggle

function renderHelp(id) {
  if (helpHidden || !HELP[id]) return '';
  const [title, intro, items] = HELP[id];
  const open = helpOpen[id] !== false;
  return `
  <section class="help" data-open="${open}">
    <button class="help-hd" data-help="${id}" aria-expanded="${open}">
      ${svg(ICON.help, 17)} ${title}
      <span class="help-lang">help.${id} · en</span>
      <span class="chev">${svg(ICON.chev, 16)}</span>
    </button>
    <div class="help-body">
      <p>${intro}</p>
      <dl class="help-list">
        ${items.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}
      </dl>
      <div class="help-more"><a href="#" onclick="return false">Learn more ${svg(ICON.ext, 13)}</a></div>
    </div>
  </section>`;
}

function renderNav() {
  document.getElementById('nav').innerHTML = PAGES.map(p => `
    ${p.sec ? `<div class="nav-sec">${p.sec}</div>` : ''}
    <button class="nav-item" data-page="${p.id}" ${current === p.id ? 'aria-current="page"' : ''}>
      ${svg(ICON[p.icon])}<span>${p.label}</span>
      ${p.badge ? `<span class="nav-badge">${p.badge}</span>` : ''}
    </button>`).join('');
}

function render() {
  const page = PAGES.find(p => p.id === current);
  document.getElementById('pageTitle').textContent = page.label;
  document.getElementById('content').innerHTML =
    renderHelp(current) + (current === 'test' ? R.test(testSub) : R[current]());
  renderNav();
  window.scrollTo({ top: 0 });
}

document.getElementById('brandMark').innerHTML = foyerMark(23);

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-page]');
  if (nav) { current = nav.dataset.page; render(); return; }

  const goto = e.target.closest('[data-goto]');
  if (goto) { current = goto.dataset.goto; render(); return; }

  const st = e.target.closest('[data-subtab]');
  if (st) { testSub = st.dataset.subtab; render(); return; }

  const h = e.target.closest('[data-help]');
  if (h) {
    const id = h.dataset.help;
    helpOpen[id] = helpOpen[id] === false;
    const box = h.closest('.help');
    box.dataset.open = helpOpen[id];
    h.setAttribute('aria-expanded', helpOpen[id]);
    return;
  }

  const s = e.target.closest('.sw');
  if (s) { s.setAttribute('aria-checked', s.getAttribute('aria-checked') !== 'true'); return; }

  const chip = e.target.closest('.scn-chip');
  if (chip) {
    chip.parentElement.querySelectorAll('.scn-chip').forEach(c => c.setAttribute('aria-pressed', 'false'));
    chip.setAttribute('aria-pressed', 'true');
    return;
  }

  const tab = e.target.closest('.tab:not([data-subtab])');
  if (tab) {
    tab.parentElement.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', 'false'));
    tab.setAttribute('aria-selected', 'true');
    return;
  }

  const row = e.target.closest('tbody tr.clickable');
  if (row) {
    row.closest('tbody').querySelectorAll('tr').forEach(r => r.removeAttribute('aria-selected'));
    row.setAttribute('aria-selected', 'true');
  }
});

/* global help toggle */
const helpBtn = document.getElementById('helpBtn');
function paintHelpBtn() {
  helpBtn.innerHTML = svg(ICON.help);
  helpBtn.style.color = helpHidden ? '' : 'var(--ha-primary)';
}
helpBtn.addEventListener('click', () => { helpHidden = !helpHidden; paintHelpBtn(); render(); });

/* theme toggle — stamps data-theme exactly as the host does */
const themeBtn = document.getElementById('themeBtn');
function paintThemeBtn() {
  const explicit = document.documentElement.getAttribute('data-theme');
  const dark = explicit ? explicit === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  themeBtn.innerHTML = svg(dark ? ICON.sun : ICON.moon);
}
themeBtn.addEventListener('click', () => {
  const explicit = document.documentElement.getAttribute('data-theme');
  const dark = explicit ? explicit === 'dark'
    : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  paintThemeBtn();
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paintThemeBtn);

paintThemeBtn();
paintHelpBtn();
render();
</script>
