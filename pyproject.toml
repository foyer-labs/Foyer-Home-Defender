[project]
name = "foyer-home-defender"
version = "0.1.0-alpha.13"
description = "An intruder alarm panel for Home Assistant"
license = "Apache-2.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
# The default run is the pure suite: no Home Assistant needed. The integration
# tests in tests/ha run in their own CI job with pytest-homeassistant-custom-component.
testpaths = ["tests/core", "tests/repo"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["frontend/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "ASYNC"]
ignore = [
    "PLR2004",  # magic values are normal in tests
    "PLC0415",  # __init__.py imports Home Assistant lazily on purpose (INV-1)
    "PLR0913",
    # A validator is a flat list of independent checks and a state machine is
    # a flat list of transitions; splitting either to satisfy a branch count
    # would scatter rules that are easiest to audit side by side.
    "PLR0911",
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
