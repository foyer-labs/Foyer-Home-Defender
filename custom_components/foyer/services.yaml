# The service contract of SPEC §9.1. Every state-changing service takes a code,
# a user, a channel and a device, and returns the structured result of §9.1, so
# that an adapter can tell a wrong code from arming blocked by an open zone.
#
# `device_id` is the name a registered arming device answers to (page 8), not a
# Home Assistant device id. A name this installation does not carry is refused:
# page 8 is a white list, because the lockout of §8.4 counts per device and a
# caller free to invent one is a caller who is never locked out.
#
# `channel` may only say `api` or `automation`. Everything else — keypad, nfc —
# is a property of a registered device, never a claim a message makes, or an
# automation could buy the per-user code exemption of §8.2 by typing a word.
#
# foyer.walk_test and foyer.test_action arrived with Phase 3, which is what
# decision 86 was waiting for: a service that exists and does nothing answers
# its caller with silence.

arm:
  fields:
    scenario_id:
      required: false
      selector:
        text:
    scenario_name:
      required: false
      example: Night
      selector:
        text:
    area_id:
      required: false
      selector:
        text:
    mode:
      required: false
      selector:
        select:
          options:
            - armed_home
            - armed_away
            - armed_night
            - armed_vacation
            - armed_custom_bypass
    force:
      required: false
      default: false
      selector:
        boolean:
    skip_exit_delay:
      required: false
      default: false
      selector:
        boolean:
    code:
      required: false
      example: "123456"
      selector:
        text:
          type: password
    user_id:
      required: false
      selector:
        text:
    channel:
      required: false
      selector:
        select:
          options:
            - api
            - automation
    device_id:
      required: false
      example: keypad_hall
      selector:
        text:

